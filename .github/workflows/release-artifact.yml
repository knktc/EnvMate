name: Build release artifact

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    name: Build and upload ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build ZIP
        run: make zip

      - name: Upload ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/envmate-*.zip --clobber
