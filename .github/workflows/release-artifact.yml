name: Build release artifact

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-upload:
    name: Build and upload ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Build ZIP
        run: make zip

      - name: Create release and upload ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/envmate-*.zip --clobber
