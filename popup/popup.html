<!doctype html>
<html lang="en" data-i18n-title="extName">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EnvMate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div class="header__brand">
          <img class="header__logo" src="../assets/icons/icon-48.png" alt="EnvMate logo" />
          <div>
            <h1 data-i18n="extName">EnvMate</h1>
            <p id="current-url" data-i18n="loadingCurrentTab">Loading current tab...</p>
          </div>
        </div>
        <button id="open-options" class="icon-button" type="button" title="Open settings" data-i18n-title="openSettings">⚙</button>
      </header>

      <section id="environment-card" class="environment-card">
        <div class="environment-card__head">
          <div class="environment-card__label" data-i18n="currentEnvironment">Current environment</div>
          <label id="environment-toggle" class="toggle-control" title="Enable this environment" data-i18n-title="enableEnvironment">
            <input id="environment-enabled" type="checkbox" />
            <span class="toggle-control__switch" aria-hidden="true"></span>
          </label>
        </div>
        <div id="environment-name" class="environment-card__name" data-i18n="checking">Checking...</div>
        <div id="environment-meta" class="environment-card__meta"></div>
        <button id="quick-add-environment" class="quick-action-button environment-card__action" type="button" hidden data-i18n="quickAddCurrentPage">
          Add Current Site
        </button>
        <div id="environment-tools" class="environment-card__tools" hidden>
          <button id="environment-tools-toggle" class="environment-tools-toggle" type="button" aria-expanded="false" title="More features">
            <svg class="environment-tools-toggle__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
        </div>
      </section>

      <section id="environment-tools-panel" class="environment-tools-panel" hidden>
        <button id="page-editing-toggle" class="page-editing-button" type="button">
          <svg class="page-editing-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
          <span id="page-editing-label">Edit Page Text</span>
        </button>
      </section>

      <section id="accounts-section" class="section">
        <div class="section__head">
          <h2 data-i18n="testAccounts">Test Accounts</h2>
        </div>
        <div id="accounts" class="account-list"></div>
      </section>

      <section id="favorites-section" class="section" hidden>
        <div class="section__head">
          <h2 data-i18n="quickAccess">Quick Access</h2>
        </div>
        <div id="favorites" class="favorites-list"></div>
        <button id="favorites-more" class="link-button favorites-more" type="button" hidden data-i18n="showMoreGroups">
          Show More Groups
        </button>
      </section>
    </main>
    <script src="../src/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
